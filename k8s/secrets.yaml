apiVersion: v1
kind: Secret
metadata:
  name: jewelia-secrets
type: Opaque
stringData:
  database-url: "postgresql://postgres:password@postgres:5432/jewelia?schema=public"
  jwt-secret: "your-jwt-secret-change-in-production"
  jwt-refresh-secret: "your-refresh-secret-change-in-production"
  razorpay-key-id: "your-razorpay-key-id"
  razorpay-key-secret: "your-razorpay-key-secret"
  razorpay-webhook-secret: "your-razorpay-webhook-secret"
