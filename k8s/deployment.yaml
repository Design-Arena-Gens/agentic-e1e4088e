apiVersion: apps/v1
kind: Deployment
metadata:
  name: jewelia-backend
  labels:
    app: jewelia-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jewelia-backend
  template:
    metadata:
      labels:
        app: jewelia-backend
    spec:
      containers:
      - name: backend
        image: jewelia-backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: jewelia-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jewelia-secrets
              key: jwt-secret
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: jewelia-secrets
              key: jwt-refresh-secret
        - name: RAZORPAY_KEY_ID
          valueFrom:
            secretKeyRef:
              name: jewelia-secrets
              key: razorpay-key-id
        - name: RAZORPAY_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: jewelia-secrets
              key: razorpay-key-secret
        - name: REDIS_HOST
          value: "jewelia-redis"
        - name: REDIS_PORT
          value: "6379"
        - name: ELASTICSEARCH_NODE
          value: "http://jewelia-elasticsearch:9200"
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jewelia-backend
spec:
  selector:
    app: jewelia-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: LoadBalancer
